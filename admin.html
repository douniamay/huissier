<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة التحكم</title>
<style>
:root{--d:#0b1d33;--g:#c5a253;--gs:#c5a2531f;--bg:#f7f4ef;--s2:#fbf8f3;--b:#ece6db;--m:#6b7a93;--r:#b4232a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#0f1e36;font:14px/1.7 Tajawal,system-ui,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h2{margin:0 0 14px;font-size:21px}h3{margin:0 0 10px;font-size:15px}
.card{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px}.mu{color:var(--m);font-size:12px}.w{width:100%}
.btn{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--b);background:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;font-size:13px;white-space:nowrap}
.pri{background:var(--d);color:#fff;border-color:var(--d)}.dng{color:var(--r);background:#fef2f2;border-color:#fee2e2}.wab{background:#25D3661a;color:#128C7E;border-color:#25D36633}
input,select,textarea{width:100%;height:42px;border:1px solid var(--b);background:var(--s2);border-radius:12px;padding:0 12px;outline:0}textarea{height:80px;padding:10px}input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gs)}
input[type=checkbox]{width:auto;height:auto}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
header{background:#fff;border-bottom:1px solid var(--b);height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:5}header b{flex:1;font-size:16px}
.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 60px)}nav{background:var(--d);padding:14px;display:flex;flex-direction:column;gap:6px}
nav button{height:42px;border:0;border-radius:12px;background:0;color:#ffffffb3;text-align:right;padding:0 14px;font-weight:700;cursor:pointer}nav button.on{background:#fff;color:var(--d)}
main{padding:22px;min-width:0;max-width:1100px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.g2f{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
.st b{display:block;font-size:28px;line-height:1.3}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--b);cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12px}.bar span{width:110px}.bar i{flex:1;height:7px;background:var(--b);border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:var(--g)}
.bw{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.bw h2{margin:0}.fl{display:flex;gap:10px;margin-bottom:12px}.tw{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;min-width:680px}th{background:var(--s2);font-size:11px;color:var(--m);text-align:right;padding:11px 14px}td{padding:11px 14px;border-top:1px solid var(--b);vertical-align:middle}.ac{display:flex;gap:6px;flex-wrap:wrap}
.bd,.ss{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid;width:auto;height:auto}.s0{background:#fffbeb;color:#b45309;border-color:#fde68a}.s1{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.s2{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.off{opacity:.6;border-style:dashed}.ic{font-size:26px}.err{background:#fef2f2;color:var(--r);padding:9px 12px;border-radius:12px;margin:12px 0;font-size:13px}
.lg{min-height:100vh;display:grid;place-items:center;padding:18px}.lg .card{width:100%;max-width:400px;padding:28px;text-align:center}.lg label,.lg .err{text-align:right}.lg .btn{justify-content:center;margin-top:6px;height:44px}.logo{width:56px;height:56px;margin:0 auto 10px;border-radius:16px;background:var(--d);color:var(--g);display:grid;place-items:center;font-size:28px}
.mo{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:20}.mo[hidden]{display:none}.mb{width:100%;max-width:480px;max-height:90vh;overflow:auto}
.kv{display:grid;grid-template-columns:90px 1fr;gap:8px 10px;align-items:center}.kv span{color:var(--m);font-size:12px}.box{background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:12px;white-space:pre-wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:30}#toast.show{opacity:1}#toast.bad{background:var(--r)}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto}nav button{white-space:nowrap}main{padding:14px}.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2f{grid-template-columns:1fr}.fl{flex-direction:column}}
</style></head><body><div id="app"></div><div id="modal" class="mo" hidden></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),T=['تبليغ قضائي','تنفيذ حكم','معاينة ميدانية','محضر جمعية عامة'],S=['جديد','تم الاتصال','مكتمل'],IC={scale:'⚖',gavel:'🔨',eye:'👁',building:'🏢'};
let csrf='',user=null,tab='dash',reqs=[],SV=[],F={q:'',s:'',t:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wa=p=>{let d=String(p).replace(/\D/g,'');if(d[0]==='0')d='213'+d.slice(1);return'https://wa.me/'+d};
const badge=s=>`<span class="bd s${S.indexOf(s)}">${esc(s)}</span>`;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',3000)}
async function api(a,d){let j;try{const r=await fetch('api/admin.php?action='+a,{method:a==='me'?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:a==='me'?undefined:JSON.stringify(d||{})});j=await r.json();if(j.csrf)csrf=j.csrf;if(r.status===401&&a!=='login'){user=null;login()}}catch(e){j={ok:false,error:'تعذّر الاتصال بالخادم'}}return j}
async function init(){const j=await api('me');if(j.loggedIn){user=j.user;shell()}else login()}
function login(){$('#app').innerHTML=`<div class="lg"><div class="card"><div class="logo">⚖</div><h2>لوحة التحكم</h2><p class="mu">مكتب المحضر القضائي</p><label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&doLogin()"><div id="le" class="err" hidden></div><button class="btn pri w" onclick="doLogin()">تسجيل الدخول</button></div></div>`}
async function doLogin(){const j=await api('login',{email:$('#em').value,password:$('#pw').value});if(!j.ok){const e=$('#le');e.hidden=false;e.textContent=j.error;return}const m=await api('me');user=m.user;tab='dash';shell()}
async function logout(){await api('logout');user=null;await api('me');login()}
const NAV=[['dash','الرئيسية'],['reqs','الطلبات'],['svc','الخدمات'],['set','الإعدادات']],V={dash:vDash,reqs:vReqs,svc:vSvc,set:vSet};
function shell(){$('#app').innerHTML=`<header><b>⚖ لوحة التحكم</b><span class="mu">${esc(user.full_name)}</span><button class="btn" onclick="logout()">خروج</button></header><div class="app"><nav>${NAV.map(n=>`<button id="n-${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><main id="main"></main></div>`;go(tab)}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='n-'+t));V[t]()}
function modal(h){const m=$('#modal');m.innerHTML=`<div class="card mb" onclick="event.stopPropagation()">${h}</div>`;m.hidden=false;m.onclick=closeM}
function closeM(){$('#modal').hidden=true}

async function vDash(){const[s,l]=await Promise.all([api('stats'),api('requests_list',{})]);if(!s.ok)return;reqs=l.requests||[];const n=t=>(s.byType.find(x=>x.type===t)||{n:0}).n;
$('#main').innerHTML=`<h2>مرحباً ${esc(user.full_name)}</h2><div class="g4">${[['إجمالي الطلبات',s.total],['طلبات اليوم',s.today],['طلبات جديدة',s.new],['تبليغ قضائي',n('تبليغ قضائي')]].map(c=>`<div class="card st"><span class="mu">${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div>
<div class="card" style="margin-top:14px"><h3>أحدث الطلبات</h3>${reqs.length?reqs.slice(0,5).map(r=>`<div class="row" onclick="det(${r.id})"><div><b>${esc(r.name)}</b><div class="mu">${esc(r.type)} • ${esc(r.created_at.slice(0,10))}</div></div>${badge(r.status)}</div>`).join(''):'<p class="mu">لا توجد طلبات بعد. ستظهر هنا عند وصول أول طلب من الموقع.</p>'}</div>
<div class="card" style="margin-top:14px"><h3>توزيع الطلبات</h3>${T.map(t=>{const p=s.total?Math.round(n(t)/s.total*100):0;return`<div class="bar"><span>${t}</span><i><u style="width:${p}%"></u></i><b>${p}%</b></div>`}).join('')}</div>`}

function vReqs(){$('#main').innerHTML=`<div class="bw"><h2>الطلبات</h2><button class="btn" onclick="csv()">تصدير CSV</button></div><div class="fl"><input placeholder="بحث بالاسم أو الهاتف أو المرجع" value="${esc(F.q)}" oninput="F.q=this.value;clearTimeout(vReqs.t);vReqs.t=setTimeout(load,300)"><select onchange="F.s=this.value;load()"><option value="">كل الحالات</option>${S.map(x=>`<option ${F.s===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="F.t=this.value;load()"><option value="">كل الأنواع</option>${T.map(x=>`<option ${F.t===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="tb"></div>`;load()}
async function load(){const j=await api('requests_list',{q:F.q,status:F.s,type:F.t});if(!j.ok)return;reqs=j.requests;$('#tb').innerHTML=reqs.length?`<div class="card tw"><table><thead><tr><th>العميل</th><th>النوع</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody>${reqs.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="mu">${esc(r.phone)} • ${esc(r.ref)}</div></td><td>${esc(r.type)}</td><td>${esc(r.created_at.slice(0,10))}</td><td><select class="ss s${S.indexOf(r.status)}" onchange="setSt(${r.id},this.value)">${S.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td><div class="ac"><button class="btn" onclick="det(${r.id})">عرض</button><a class="btn wab" target="_blank" rel="noopener" href="${wa(r.phone)}">واتساب</a><button class="btn dng" onclick="delReq(${r.id})">حذف</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="card mu">لا توجد نتائج</div>'}
async function setSt(id,s){const j=await api('request_update',{id,status:s});toast(j.ok?'تم تحديث الحالة':j.error,!j.ok);load()}
async function delReq(id){if(!confirm('حذف هذا الطلب نهائياً؟'))return;const j=await api('request_delete',{id});toast(j.ok?'تم الحذف':j.error,!j.ok);load()}
function det(id){const r=reqs.find(x=>x.id==id);if(!r)return;modal(`<h3>${esc(r.ref)}</h3><p class="mu">${esc(r.created_at)}${r.wilaya?' • '+esc(r.wilaya):''}</p><div class="kv"><span>الاسم</span><b>${esc(r.name)}</b><span>الهاتف</span><b dir="ltr" style="text-align:right">${esc(r.phone)}</b><span>النوع</span><b>${esc(r.type)}</b><span>الحالة</span><div>${badge(r.status)}</div></div><label>التفاصيل</label><div class="box">${esc(r.details)||'—'}</div><div class="bw" style="margin:14px 0 0"><a class="btn wab" target="_blank" rel="noopener" href="${wa(r.phone)}">رد عبر واتساب</a><button class="btn" onclick="closeM()">إغلاق</button></div>`)}
function csv(){const H=['المرجع','الاسم','الهاتف','النوع','التاريخ','الحالة','الولاية','التفاصيل'],q=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};const t=[H,...reqs.map(r=>[r.ref,r.name,r.phone,r.type,r.created_at,r.status,r.wilaya,r.details])].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+t],{type:'text/csv;charset=utf-8'}));a.download='requests-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}

async function vSvc(){const j=await api('services_list');if(!j.ok)return;SV=j.services;$('#main').innerHTML=`<div class="bw"><h2>الخدمات</h2><button class="btn pri" onclick="svForm(0)">+ إضافة خدمة</button></div><div class="g2">${SV.map(s=>`<div class="card ${+s.enabled?'':'off'}"><div class="ic">${IC[s.icon]||'⚖'}</div><b>${esc(s.title)}</b>${+s.enabled?'':' <span class="bd s0">معطّلة</span>'}<p class="mu">${esc(s.description)}</p><div class="ac"><button class="btn" onclick="svForm(${s.id})">تعديل</button><button class="btn" onclick="svTog(${s.id})">${+s.enabled?'تعطيل':'تفعيل'}</button><button class="btn dng" onclick="svDel(${s.id})">حذف</button></div></div>`).join('')}</div><p class="mu">التغييرات تظهر في الموقع العام مباشرة.</p>`}
function svForm(id){const s=SV.find(x=>x.id==id)||{id:0,title:'',description:'',icon:'scale',enabled:1};modal(`<h3>${id?'تعديل الخدمة':'خدمة جديدة'}</h3><label>العنوان</label><input id="vt" value="${esc(s.title)}"><label>الوصف</label><textarea id="vd">${esc(s.description)}</textarea><label>الأيقونة</label><select id="vi">${Object.keys(IC).map(k=>`<option value="${k}" ${s.icon===k?'selected':''}>${IC[k]} ${k}</option>`).join('')}</select><label><input type="checkbox" id="ve" ${+s.enabled?'checked':''}> مفعّلة في الموقع</label><div class="bw" style="margin:14px 0 0"><button class="btn pri" onclick="svSave(${s.id})">حفظ</button><button class="btn" onclick="closeM()">إلغاء</button></div>`)}
async function svSave(id){const j=await api('service_save',{id,title:$('#vt').value,description:$('#vd').value,icon:$('#vi').value,enabled:$('#ve').checked});if(!j.ok)return toast(j.error,1);closeM();toast('تم الحفظ');vSvc()}
async function svTog(id){const s=SV.find(x=>x.id==id),j=await api('service_save',{...s,enabled:!+s.enabled});toast(j.ok?'تم التحديث':j.error,!j.ok);vSvc()}
async function svDel(id){if(!confirm('حذف هذه الخدمة؟'))return;const j=await api('service_delete',{id});toast(j.ok?'تم الحذف':j.error,!j.ok);vSvc()}

const SL=[['office_name','اسم المكتب'],['lawyer_name','اسم الأستاذة'],['tagline','عبارة تعريفية قصيرة (اختياري)'],['city','الولاية (مثال: تلمسان)'],['court','المحكمة (مثال: محكمة أولاد ميمون)'],['phone','رقم الهاتف'],['whatsapp','رقم واتساب بالصيغة الدولية (213550123456)'],['email','البريد الإلكتروني للتواصل'],['address','العنوان'],['hours','ساعات العمل'],['map_query','نص البحث في الخريطة (العنوان أو اسم الحي والمدينة)'],['license_no','رقم الترخيص (اختياري)'],['years_lawyer','سنوات الخبرة في المحاماة'],['years_bailiff','سنوات الخبرة كمحضر قضائي'],['cases_count','عدد القضايا المنجزة (اتركه فارغاً إن لم يكن مؤكداً)']];
async function vSet(){const j=await api('settings_get');if(!j.ok)return;$('#main').innerHTML=`<h2>الإعدادات</h2><div class="card"><h3>معلومات المكتب</h3><p class="mu">أي حقل تتركه فارغاً لا يظهر في الموقع العام.</p><div class="g2f">${SL.map(([k,l])=>`<div><label>${l}</label><input id="s_${k}" value="${esc(j.settings[k])}"></div>`).join('')}</div><button class="btn pri" style="margin-top:14px" onclick="saveSet()">حفظ المعلومات</button></div>
<div class="g2" style="margin-top:14px"><div class="card"><h3>تغيير كلمة السر</h3><label>الحالية</label><input id="pc" type="password" autocomplete="current-password"><label>الجديدة (8 أحرف على الأقل)</label><input id="pn" type="password" autocomplete="new-password"><label>تأكيد الجديدة</label><input id="pn2" type="password" autocomplete="new-password"><button class="btn pri" style="margin-top:14px" onclick="chPw()">تحديث كلمة السر</button></div>
<div class="card"><h3>تغيير بريد الدخول</h3><p class="mu">البريد الحالي: ${esc(user.email)}</p><label>البريد الجديد</label><input id="en" type="email"><label>كلمة السر للتأكيد</label><input id="ep" type="password" autocomplete="current-password"><button class="btn pri" style="margin-top:14px" onclick="chEm()">تحديث البريد</button></div></div>`}
async function saveSet(){const settings={};SL.forEach(([k])=>settings[k]=$('#s_'+k).value);const j=await api('settings_save',{settings});toast(j.ok?'تم الحفظ، والموقع يعرض البيانات الجديدة':j.error,!j.ok)}
async function chPw(){if($('#pn').value!==$('#pn2').value)return toast('التأكيد غير مطابق',1);const j=await api('password_change',{current:$('#pc').value,new:$('#pn').value});toast(j.ok?'تم تحديث كلمة السر':j.error,!j.ok);if(j.ok)['pc','pn','pn2'].forEach(i=>$('#'+i).value='')}
async function chEm(){const j=await api('email_change',{email:$('#en').value,password:$('#ep').value});if(j.ok){user.email=$('#en').value.trim().toLowerCase();toast('تم تحديث البريد');vSet()}else toast(j.error,1)}
init();
</script></body></html>
